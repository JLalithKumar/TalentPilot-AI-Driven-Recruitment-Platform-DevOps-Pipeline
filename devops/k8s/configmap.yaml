apiVersion: v1
kind: ConfigMap
metadata:
  name: talentpilot-config
  namespace: talentpilot-prod
data:
  # Database
  SPRING_DATASOURCE_URL: "jdbc:postgresql://talentpilot-postgres.caz42usggo0m.us-east-1.rds.amazonaws.com:5432/talentpilotdb"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"

  # S3 Storage
  S3_BUCKET: "talentpilot-resumes-prod-v2"
  AWS_REGION: "us-east-1"

  # AI Service
  AI_SERVICE_URL: "http://ai-service:8000"

  # Spring Actuator (for Prometheus scraping)
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"

  # Logging
  LOGGING_LEVEL_ROOT: "WARN"
  LOGGING_LEVEL_COM_TALENTPILOT: "INFO"
