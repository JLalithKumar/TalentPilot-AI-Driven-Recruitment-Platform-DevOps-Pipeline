apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talentpilot-ingress
  namespace: talentpilot-prod
  annotations:
    # Nginx ingress controller
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # SSL redirect (enable when TLS cert is configured)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rate limiting — protect APIs from abuse
    nginx.ingress.kubernetes.io/limit-rps: "20"
    # Request size limit — allow resume uploads up to 10MB
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Backend API
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # AI Service
          - path: /ai(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ai-service
                port:
                  number: 8000
          # Frontend — catch-all (SPA routing)
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # Uncomment and add your TLS secret to enable HTTPS
  # tls:
  #   - hosts:
  #       - talentpilot.local
  #     secretName: talentpilot-tls
