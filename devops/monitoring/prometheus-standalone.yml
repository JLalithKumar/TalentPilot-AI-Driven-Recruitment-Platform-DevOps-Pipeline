global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'talentpilot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'talentpilot-ai-service'
    metrics_path: '/health'
    static_configs:
      - targets: ['ai-service:8000']
