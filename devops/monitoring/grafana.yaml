apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true

      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        jsonData:
          maxLines: 1000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "TalentPilot"
        orgId: 1
        folder: "TalentPilot"
        type: file
        options:
          path: /var/lib/grafana/dashboards

---
# Pre-built Grafana dashboard for TalentPilot
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-talentpilot
  namespace: monitoring
data:
  talentpilot.json: |
    {
      "title": "TalentPilot — Application Overview",
      "uid": "talentpilot-overview",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1,
          "title": "HTTP Requests / sec (Backend)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rate(http_server_requests_seconds_count{job=\"talentpilot-backend\"}[1m])",
            "legendFormat": "{{method}} {{uri}} {{status}}"
          }]
        },
        {
          "id": 2,
          "title": "HTTP Request Latency P99 (ms)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{job=\"talentpilot-backend\"}[5m])) * 1000",
            "legendFormat": "p99 latency"
          }]
        },
        {
          "id": 3,
          "title": "JVM Heap Used (Backend)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "expr": "jvm_memory_used_bytes{area=\"heap\", job=\"talentpilot-backend\"}",
            "legendFormat": "Heap Used"
          }]
        },
        {
          "id": 4,
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"talentpilot-prod\"}[1m])) by (pod)",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 5,
          "title": "Backend Replicas (HPA)",
          "type": "stat",
          "gridPos": { "x": 0, "y": 16, "w": 6, "h": 4 },
          "targets": [{
            "expr": "kube_deployment_status_replicas{deployment=\"backend\", namespace=\"talentpilot-prod\"}",
            "legendFormat": "Replicas"
          }]
        },
        {
          "id": 6,
          "title": "AI Service Replicas (HPA)",
          "type": "stat",
          "gridPos": { "x": 6, "y": 16, "w": 6, "h": 4 },
          "targets": [{
            "expr": "kube_deployment_status_replicas{deployment=\"ai-service\", namespace=\"talentpilot-prod\"}",
            "legendFormat": "Replicas"
          }]
        },
        {
          "id": 7,
          "title": "Error Rate (5xx)",
          "type": "stat",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 4 },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{job=\"talentpilot-backend\", status=~\"5..\"}[5m]))",
            "legendFormat": "5xx errors/s"
          }]
        }
      ]
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"   # Change in production
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboard-files
          configMap:
            name: grafana-dashboard-talentpilot

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
