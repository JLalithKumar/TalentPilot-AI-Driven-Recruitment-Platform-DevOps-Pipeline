version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talentpilot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: talentpilot_user
      POSTGRES_PASSWORD: talentpilot_password
      POSTGRES_DB: talentpilot_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - talentpilot-net

  minio:
    image: minio/minio
    container_name: talentpilot-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - talentpilot-net

volumes:
  pgdata:
  miniodata:

networks:
  talentpilot-net:
    driver: bridge
