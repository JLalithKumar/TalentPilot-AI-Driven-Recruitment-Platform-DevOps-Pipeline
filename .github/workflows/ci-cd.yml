name: TalentPilot CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/talentpilot

# ─────────────────────────────────────────────────────────────
# JOB 1 — CI: Build & Test (runs on every push and every PR)
# ─────────────────────────────────────────────────────────────
jobs:
  ci-backend:
    name: "CI — Backend (Java)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & run tests
        working-directory: ./backend
        run: mvn clean verify --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  ci-frontend:
    name: "CI — Frontend (React)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: ./frontend
        run: npm run build

  ci-ai-service:
    name: "CI — AI Service (Python)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./ai-service
        run: pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: ./ai-service
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

# ─────────────────────────────────────────────────────────────
# JOB 2 — Build & Push Docker images (only on push to main)
# ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: "Docker — Build & Push"
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend, ci-ai-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag images as both :latest and :<git-sha> for traceability
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-ai-service:latest
            ${{ env.IMAGE_PREFIX }}-ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# JOB 3 — CD: Deploy to Kubernetes (only on push to main)
# ─────────────────────────────────────────────────────────────
  deploy:
    name: "CD — Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        # Store your cluster kubeconfig as a GitHub secret (KUBE_CONFIG)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image tags in manifests
        # Replace placeholder image tags with the exact git SHA of this deploy
        run: |
          sed -i "s|YOUR_DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" devops/k8s/services/*.yaml
          sed -i "s|:latest|:${{ github.sha }}|g" devops/k8s/services/*.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f devops/k8s/setup.yaml
          kubectl apply -f devops/k8s/configmap.yaml
          kubectl apply -f devops/k8s/databases/
          kubectl apply -f devops/k8s/services/
          kubectl apply -f devops/k8s/ingress.yaml
          kubectl apply -f devops/k8s/network-policy.yaml

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/backend -n talentpilot-prod --timeout=300s
          kubectl rollout status deployment/ai-service -n talentpilot-prod --timeout=300s
          kubectl rollout status deployment/frontend -n talentpilot-prod --timeout=300s

      - name: Verify pods are running
        run: kubectl get pods -n talentpilot-prod

      - name: Post deploy summary
        run: |
          echo "✅ Deploy complete"
          echo "Image tag: ${{ github.sha }}"
          kubectl get ingress -n talentpilot-prod
