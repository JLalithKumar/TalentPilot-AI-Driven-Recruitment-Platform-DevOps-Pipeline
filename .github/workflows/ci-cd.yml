name: TalentPilot CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# ─────────────────────────────────────────────────────────────
# JOB 1 — CI: Build & Test (runs on every push and every PR)
# ─────────────────────────────────────────────────────────────
jobs:
  ci-backend:
    name: "CI — Backend (Java)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build & run tests
        working-directory: ./backend
        run: mvn clean verify --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  ci-frontend:
    name: "CI — Frontend (React)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: ./frontend
        run: npm run build

  ci-ai-service:
    name: "CI — AI Service (Python)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./ai-service
        run: pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: ./ai-service
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

# ─────────────────────────────────────────────────────────────
# JOB 2 — Build & Push Docker images (only on push to main)
# ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: "Docker — Build & Push"
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend, ci-ai-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}-backend:latest
            ghcr.io/${{ env.REPO_LC }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}-ai-service:latest
            ghcr.io/${{ env.REPO_LC }}-ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}-frontend:latest
            ghcr.io/${{ env.REPO_LC }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# JOB 3 — CD: Deploy to Kubernetes (only if KUBE_CONFIG present)
# ─────────────────────────────────────────────────────────────
  deploy:
    name: "CD — Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check KUBE_CONFIG secret
        id: check_kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret not set. Skipping Kubernetes deployment step."
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
          else
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up kubectl
        if: steps.check_kubeconfig.outputs.has_kubeconfig == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        if: steps.check_kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          mkdir -p $HOME/.kube
          if echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kube.tmp 2>/dev/null && grep -q "apiVersion" /tmp/kube.tmp; then
            mv /tmp/kube.tmp $HOME/.kube/config
          else
            echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config
          kubectl config set-cluster default --insecure-skip-tls-verify=true 2>/dev/null || true

      - name: Update image tags in manifests
        if: steps.check_kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          sed -i "s|:latest|:${{ github.sha }}|g" devops/k8s/services/*.yaml

      - name: Apply Kubernetes manifests
        if: steps.check_kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          echo "Applying Kubernetes manifests for image tag: ${{ github.sha }}"
          kubectl apply -f devops/k8s/setup.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f devops/k8s/configmap.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f devops/k8s/services/ --insecure-skip-tls-verify --validate=false
          kubectl apply -f devops/k8s/ingress.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f devops/k8s/network-policy.yaml --insecure-skip-tls-verify --validate=false

      - name: Wait for rollout to complete
        if: steps.check_kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          echo "Checking deployment rollout status..."
          kubectl rollout status deployment/backend -n talentpilot-prod --timeout=120s
          kubectl rollout status deployment/ai-service -n talentpilot-prod --timeout=120s
          kubectl rollout status deployment/frontend -n talentpilot-prod --timeout=120s

      - name: Verify pods are running
        if: steps.check_kubeconfig.outputs.has_kubeconfig == 'true'
        run: kubectl get pods -n talentpilot-prod -o wide

      - name: Post deploy summary
        if: steps.check_kubeconfig.outputs.has_kubeconfig == 'true'
        run: |
          echo "========================================="
          echo "🚀 DEPLOYMENT COMPLETED SUCCESSFULLY 🚀"
          echo "Image tag: ${{ github.sha }}"
          echo "Target Cluster: talentpilot-k3s-node (AWS us-east-1)"
          echo "========================================="
