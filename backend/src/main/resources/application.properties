server.port=8080

# Database Configuration (Overridden by environment variables in K8s / Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentpilotdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:talentpilot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:talentpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security Configuration
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
jwt.expiration=86400000

# S3 / Object Storage Configuration
aws.s3.endpoint=${AWS_S3_ENDPOINT:https://s3.us-east-1.amazonaws.com}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:dummy}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:dummy}
aws.s3.bucket=${S3_BUCKET:talentpilot-resumes-prod-v2}
aws.s3.region=${AWS_REGION:us-east-1}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Spring Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
